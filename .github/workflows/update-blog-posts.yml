name: Update recent blog posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed parser
        run: python -m pip install --disable-pip-version-check feedparser

      - name: Update recent posts
        run: python main.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "No new posts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update recent blog posts"
          git push
